name: Validate code and data rules

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify generated frontend
        run: |
          node scripts/build-app.js
          git diff --exit-code -- assets/app.js
