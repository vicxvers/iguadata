<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Iguadata</title>
    <!--
        SPA fallback per a GitHub Pages.
        Quan el visitant entra directament a /contractes/foo o /empreses/bar,
        GH Pages no troba l'arxiu i serveix aquesta pàgina. Aquí codifiquem
        el path a un query string i redirigim a l'arrel del projecte; allà
        l'index.html el desxifra i restaura la URL real amb history.replaceState.
        Tècnica: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
        // segmentCount = nombre de segments del basePath del projecte.
        // Per a vicxvers.github.io/iguadata-dev/ → 1
        // Si algun dia migres a domini propi (CNAME) → 0
        var segmentCount = (window.location.hostname.endsWith('github.io')) ? 1 : 0;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
